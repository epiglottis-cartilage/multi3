[package]
name = "multi3"
version = "1.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
derive_more = { version = "*", features = ["from"] }
socket2 = "*"
toml = "*"
serde = { version = "*", features = ["derive"] }
crossterm = "*"
ratatui = "*"
ouroboros = "*"
time = "*"
rustls = "*"
rcgen = { version = "*", features = ["x509-parser"] }
webpki = "*"
webpki-roots = "*"

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
